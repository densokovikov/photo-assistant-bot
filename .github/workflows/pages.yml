name: Publish photography course

on:
  push:
    branches: [main]
    paths:
      - portrait-course.html
      - photographers-table.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public pages
        run: |
          mkdir -p _site
          cp portrait-course.html _site/index.html
          cp portrait-course.html _site/portrait-course.html
          cp photographers-table.html _site/photographers-table.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
