name: Daily Telegram photo lesson

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Moscow"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-telegram-photo-lesson
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send photographer and assignment
        working-directory: photographer-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUD_START_DATE: "2026-10-10"
          PHOTOGRAPHER_START_INDEX: "0"
          ASSIGNMENT_START_INDEX: "0"
        run: python send_cloud.py
